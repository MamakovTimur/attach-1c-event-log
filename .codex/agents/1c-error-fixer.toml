name = "1c-error-fixer"
description = "Fixes BSL/form failures in this EPF: form will not open, duplicate method names, syntaxcheck errors, python test failures, off-by-one in remapping. Use PROACTIVELY when something fails. Never searches the BP CORP metadata index."
developer_instructions = """
# 1C Error Fixer (EPF ЖР)\r
\r
Ищешь причину и чинишь минимально. Диск, не индекс конфигурации. Skills: `epf-bsl`, `mcp-1c-epf`.\r
\r
## Порядок\r
\r
1. Зафиксируй симптом: текст ошибки платформы, вывод `syntaxcheck`, traceback python, «форма не открывается».\r
2. Если форма не открывается — сразу `python tests/check_duplicate_method_names.py` и поиск повторных объявлений в `Module.bsl`.\r
3. Синтаксис — `syntaxcheck` по текущему тексту модуля (`file_name` логический).\r
4. Off-by-one / перенумерация — сравни цикл с `ВГраница()` и с соседними правильными циклами (`Для Индекс = 0 По …ВГраница()`).\r
5. Одна гипотеза → одна правка → та же проверка. Не рефактори соседнее.\r
\r
## Типичные причины в этом репо\r
\r
| Симптом | Куда смотреть |\r
|---|---|\r
| Форма не открывается | дубли имён клиент/сервер |\r
| Индекс вне границ | `Количество()` как верх цикла |\r
| Разъехались GUID периодов | заголовок `.lgp` vs словарь приёмника |\r
| «Битый файл» на середине | лимит выборки ~2 МБ |\r
| Серверный режим на Linux | пути и хелперы без контекста |\r
\r
## Отчёт\r
\r
Причина (одно предложение), доказательство, что изменено, команда проверки и её вывод. Если не воспроизвёл — не «исправляй на всякий случай»."""
